<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serial Monitor — Chopper Head</title>
<link rel="stylesheet" href="/assets/common.css">
<style>
html{height:100%}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;padding:0;margin:0}
@supports(height:100dvh){body{height:100dvh}}
.page-header{flex-shrink:0;padding:12px 22px 12px;max-width:none;margin:0}
main{flex:1 1 0;display:flex;flex-direction:column;min-height:0;max-width:none;margin:0;padding:0;width:100%;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:.4rem;padding:.4rem 16px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;row-gap:.35rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .4s}
.dot.ok{background:#3a3;animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.conn-lbl{font:500 11px/1 ui-monospace,'SF Mono',Menlo,monospace;color:var(--muted);letter-spacing:.1em;flex:1;min-width:4rem}
.tbtn{background:var(--surface);border:1px solid var(--border);color:var(--text);
      min-height:44px;padding:0 .9rem;font-family:inherit;font-size:.78rem;
      letter-spacing:.1em;cursor:pointer;flex-shrink:0;border-radius:4px;
      touch-action:manipulation;transition:border-color .15s,color .15s;
      display:inline-flex;align-items:center;justify-content:center}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.on{border-color:var(--accent);background:rgba(232,122,32,.06)}
.tsep{width:1px;height:1.6rem;background:var(--border);flex-shrink:0;margin:0 .1rem;align-self:center}
.log{flex:1 1 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.6rem 16px;
     font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.8rem;
     line-height:1.65;background:#1a1a1a;min-height:0}
.ll{white-space:pre-wrap;word-break:break-all}
.ll.tx{color:#c47a35}
.ll.rx{color:#7cf}
.ll.info{color:#666}
.cmd-bar{display:flex;flex-direction:column;gap:.4rem;padding:.5rem 16px 4rem;border-top:2px solid var(--accent);background:var(--surface);flex-shrink:0}
.cmd-btns{display:flex;gap:.35rem;flex-wrap:wrap}
.cmd-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);
         min-height:40px;padding:0 .8rem;font:500 .76rem/1 ui-monospace,'SF Mono',Menlo,monospace;
         letter-spacing:.08em;cursor:pointer;border-radius:4px;
         touch-action:manipulation;transition:border-color .15s,color .15s,background .12s;
         display:inline-flex;align-items:center;justify-content:center}
.cmd-btn:hover{border-color:var(--accent);color:var(--accent)}
.cmd-btn:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cmd-sep{width:1px;height:1.8rem;background:var(--border);flex-shrink:0;align-self:center}
.send-row{display:flex;gap:.5rem;align-items:stretch}
#cmd{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);
     padding:.5rem .65rem;font-family:ui-monospace,'SF Mono',Menlo,monospace;
     font-size:16px;min-width:0;border-radius:4px;min-height:44px;
     -webkit-appearance:none}
#cmd:focus{outline:none;border-color:var(--accent)}
#sbtn{background:var(--surface);border:1px solid var(--border);color:var(--text);
      min-height:44px;padding:0 1.1rem;font-family:inherit;font-size:.85rem;
      letter-spacing:.1em;cursor:pointer;flex-shrink:0;border-radius:4px;
      touch-action:manipulation;transition:border-color .15s,color .15s;
      display:inline-flex;align-items:center}
#sbtn:hover{border-color:var(--accent);color:var(--accent)}
.cmd-lbl{font:500 9px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.18em;
         text-transform:uppercase;color:var(--muted);padding:0 2px}
@media(max-width:400px){
  .tbtn{min-height:40px;padding:0 .65rem;font-size:.72rem}
  .cmd-btn{min-height:36px;padding:0 .6rem;font-size:.7rem}
}
</style>
<script>!function(){var t=localStorage.getItem("chopper-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}()</script>
</head>
<body>
<div class="page-header">
  <a class="back" href="/">&#9664; BACK</a>
  <div class="page-title"><span class="dot"></span><span class="label">Serial Monitor</span><span class="dot"></span></div>
</div>
<main>
  <div class="toolbar">
    <div class="dot" id="dot"></div>
    <span class="conn-lbl" id="conn">Connecting&#8230;</span>
    <button class="tbtn on" id="f-LOG" onclick="toggleFilter('LOG')" title="LOG — USB console output">LOG</button>
    <button class="tbtn on" id="f-S2" onclick="toggleFilter('S2')" title="S2 — Maestro UART">S2</button>
    <span class="tsep"></span>
    <button class="tbtn" id="pbtn" onclick="togglePause()">Pause</button>
    <button class="tbtn" onclick="clearLog()">Clear</button>
  </div>
  <div class="log" id="log"></div>
  <div class="cmd-bar">
    <div class="cmd-btns">
      <span class="cmd-lbl">Buttons</span>
      <button class="cmd-btn" onclick="sendBtn('y')">Y</button>
      <button class="cmd-btn" onclick="sendBtn('x')">X</button>
      <button class="cmd-btn" onclick="sendBtn('b')">B</button>
      <span class="cmd-sep"></span>
      <button class="cmd-btn" onclick="sendBtn('du')">D&#8593;</button>
      <button class="cmd-btn" onclick="sendBtn('dd')">D&#8595;</button>
      <button class="cmd-btn" onclick="sendBtn('dl')">D&#8592;</button>
      <button class="cmd-btn" onclick="sendBtn('dr')">D&#8594;</button>
    </div>
    <div class="send-row">
      <input id="cmd" type="text" placeholder="button or macro (e.g. y, du, 101)" autocomplete="off"
             autocorrect="off" autocapitalize="none" spellcheck="false"
             inputmode="text" enterkeyhint="send"
             onkeydown="if(event.key==='Enter')sendCustom()">
      <button id="sbtn" onclick="sendCustom()">Send</button>
    </div>
  </div>
</main>
<script>
var _seq      = -1;
var _paused   = false;
var _autoScroll = true;
var _entries  = [];
var _filters  = { LOG: true, S2: true };

var logEl  = document.getElementById('log');
var dotEl  = document.getElementById('dot');
var connEl = document.getElementById('conn');
var pbtn   = document.getElementById('pbtn');

logEl.addEventListener('scroll', function() {
  _autoScroll = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 20;
});

function portOf(text) {
  var m = text.match(/^(S2|LOG|WEB)/);
  return m ? m[1] : null;
}

function shouldShow(entry) {
  var port = portOf(entry.t);
  if (port === null) return true;
  if (port === 'WEB') return true;
  if (!_filters[port]) return false;
  return true;
}

function addLine(text, cls) {
  var d = document.createElement('div');
  d.className = 'll' + (cls ? ' '+cls : '');
  d.textContent = text;
  logEl.appendChild(d);
  if (_autoScroll) logEl.scrollTop = logEl.scrollHeight;
}

function renderLog() {
  logEl.innerHTML = '';
  for (var i = 0; i < _entries.length; i++) {
    if (shouldShow(_entries[i])) addLine(_entries[i].t, _entries[i].c);
  }
  if (_autoScroll) logEl.scrollTop = logEl.scrollHeight;
}

function appendEntries(lines) {
  for (var i = 0; i < lines.length; i++) {
    _entries.push(lines[i]);
    if (shouldShow(lines[i])) addLine(lines[i].t, lines[i].c);
  }
}

function toggleFilter(key) {
  _filters[key] = !_filters[key];
  var btn = document.getElementById('f-' + key);
  if (btn) btn.className = 'tbtn' + (_filters[key] ? ' on' : '');
  renderLog();
}

function poll(silentResync) {
  if (_paused) return;
  fetch('/api/monitor').then(function(r){ return r.json(); }).then(function(d){
    dotEl.className = 'dot ok';
    connEl.textContent = 'Connected';
    if (silentResync) { _seq = d.seq; return; }
    if (d.seq === _seq) return;
    var lines = d.lines || [];
    if (_seq === -1) {
      _entries = [];
      appendEntries(lines);
    } else {
      var delta = d.seq - _seq;
      var numNew = Math.min(delta, lines.length);
      if (delta > lines.length) {
        appendEntries([{t: '--- ' + (delta - lines.length) + ' line(s) lost (buffer overflow) ---', c: 'info'}]);
      }
      if (numNew > 0) appendEntries(lines.slice(lines.length - numNew));
    }
    _seq = d.seq;
  }).catch(function(){
    dotEl.className = 'dot';
    connEl.textContent = 'Disconnected \u2014 retrying\u2026';
  });
}

function sendBtn(btn) {
  fetch('/api/command', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'button=' + encodeURIComponent(btn)
  }).then(function(r){
    if (!r.ok) addLine('! Command error ' + r.status, 'info');
    else setTimeout(poll, 200);
  }).catch(function(){ addLine('! Send failed', 'info'); });
}

function sendCustom() {
  var inp = document.getElementById('cmd');
  var val = inp.value.trim();
  if (!val) return;
  inp.value = '';

  // If it looks like a number or comma-separated numbers, treat as macro
  if (/^\d[\d,]*$/.test(val)) {
    fetch('/api/command', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'macro=' + encodeURIComponent(val)
    }).then(function(r){
      if (!r.ok) addLine('! Command error ' + r.status, 'info');
      else setTimeout(poll, 200);
    }).catch(function(){ addLine('! Send failed', 'info'); });
  } else {
    sendBtn(val);
  }
}

function clearLog() { logEl.innerHTML = ''; _entries = []; }

function togglePause() {
  _paused = !_paused;
  pbtn.textContent = _paused ? 'Resume' : 'Pause';
  pbtn.className   = 'tbtn' + (_paused ? ' on' : '');
  if (_paused) return;
  poll(_seq !== -1);
}

poll();
setInterval(poll, 1500);
</script>
</body>
</html>
